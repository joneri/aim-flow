name: Beta packaging checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify extraction
        run: python3 scripts/verify_provenance.py
      - name: Run offline contracts without Git 2.54 requirement
        run: |
          python3 -B -m unittest discover -s tests -p test_source_free_release.py
          python3 -B -m unittest discover -s tests -p test_source_check.py
          python3 -B -m unittest discover -s tests -p test_source_subset.py
          python3 -B -m unittest discover -s tests -p test_docker_engine.py
          python3 -B -m unittest discover -s tests -p test_docker_image_evidence.py
          python3 -B -m unittest discover -s tests -p test_docker_recipe.py
          python3 -B -m unittest discover -s tests -p test_recipe_execution.py
          python3 -B -m unittest discover -s tests -p test_npm_acquisition.py
          python3 -B -m unittest discover -s tests -p test_npm_platform.py
      - name: Run Node protocol tests
        run: node --test tests/test_npm_platform_build.cjs
      - name: Check branded download
        run: python3 scripts/check_bundle.py site/downloads/aim-flow-0.1.0-beta.1.zip
      - name: Build and verify branded package
        run: |
          python3 scripts/package_beta.py --output "$RUNNER_TEMP/aim-flow-beta"
          python3 scripts/check_bundle.py "$RUNNER_TEMP/aim-flow-beta/aim-flow-0.1.0-beta.1.zip"
      - name: Check static website
        run: python3 scripts/check_site.py
      - name: Show beta version
        run: python3 aim-flow.py --version
  deploy-pages:
    name: Publish Beta website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: aim-flow-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
