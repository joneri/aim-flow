name: Beta packaging checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify extraction
        run: python3 scripts/verify_provenance.py
      - name: Select Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.3.0
      - name: Verify Git prerequisite
        run: |
          git --version
          python3 -c 'import re, subprocess; version = tuple(map(int, re.search(r"git version (\d+)\.(\d+)", subprocess.check_output(["git", "--version"], text=True)).groups())); assert version >= (2, 54), "Git 2.54+ is required for the complete offline suite"'
      - name: Run portable offline regression (platform skips reported)
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Node protocol tests
        run: node --test tests/test_npm_platform_build.cjs tests/test_project_container_runner.cjs
      - name: Check branded download
        run: python3 scripts/check_bundle.py site/downloads/aim-flow-0.1.0-beta.9.zip
      - name: Build and verify branded package
        run: |
          python3 scripts/package_beta.py --output "$RUNNER_TEMP/aim-flow-beta"
          python3 scripts/check_bundle.py "$RUNNER_TEMP/aim-flow-beta/aim-flow-0.1.0-beta.9.zip"
      - name: Check static website
        run: python3 scripts/check_site.py
      - name: Show beta version
        run: python3 aim-flow.py --version
  deploy-pages:
    name: Publish Beta website
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: offline-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: aim-flow-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
